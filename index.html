<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>nenaivniy.duckdns.org — скоро открытие</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<style>
  :root {
    --bg: #060714;
    --ink: #f3f4ff;
    --ink-soft: rgba(233, 236, 255, 0.68);
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.12);
    --edge: rgba(255, 255, 255, 0.22);
    --ok: #5df2b0;
    --mx: 50%;
    --my: 30%;
    --font: "Segoe UI Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Фон: жидкие цветные пятна ---------- */
  .liquid {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.85;
    will-change: transform;
  }
  .blob.a {
    width: 46vmax; height: 46vmax;
    left: -12vmax; top: -14vmax;
    background: radial-gradient(circle at 35% 35%, #6d5bff, #3a2bd6 60%, transparent 72%);
    animation: drift-a 26s ease-in-out infinite alternate;
  }
  .blob.b {
    width: 40vmax; height: 40vmax;
    right: -10vmax; top: 12vmax;
    background: radial-gradient(circle at 60% 40%, #19d3ff, #0a7bd8 58%, transparent 72%);
    animation: drift-b 32s ease-in-out infinite alternate;
  }
  .blob.c {
    width: 36vmax; height: 36vmax;
    left: 18vmax; bottom: -16vmax;
    background: radial-gradient(circle at 50% 50%, #ff4fa3, #b1237a 58%, transparent 72%);
    animation: drift-c 29s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
  @keyframes drift-b { to { transform: translate(-16vmax, 10vmax) scale(0.9); } }
  @keyframes drift-c { to { transform: translate(14vmax, -12vmax) scale(1.2); } }

  /* зерно, чтобы градиенты не «полосатили» */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.07;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Главная стеклянная панель ---------- */
  main {
    position: relative;
    z-index: 2;
    width: min(760px, 100%);
  }

  .pane {
    position: relative;
    isolation: isolate;
    padding: clamp(28px, 6vw, 56px);
    border-radius: 36px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.08));
    border: 1px solid var(--edge);
    -webkit-backdrop-filter: blur(30px) saturate(170%);
    backdrop-filter: blur(30px) saturate(170%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 0 rgba(255,255,255,0.08),
      inset 0 0 40px rgba(255,255,255,0.05),
      0 30px 80px -20px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* блик, следующий за курсором */
  .pane::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255,255,255,0.20), transparent 60%);
    transition: opacity .3s;
  }

  /* диагональная «полоса света» по стеклу */
  .pane::after {
    content: "";
    position: absolute;
    top: -40%;
    left: -60%;
    width: 40%;
    height: 180%;
    z-index: -1;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    transform: rotate(18deg);
    animation: sheen 2.4s 0.5s cubic-bezier(.2,.7,.2,1) 1 forwards;
  }
  @keyframes sheen { to { left: 140%; } }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 12px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    font-size: 14px;
    color: var(--ink-soft);
  }
  .status i {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(93,242,176,0.6);
    animation: ping 2.2s infinite;
  }
  @keyframes ping {
    70%  { box-shadow: 0 0 0 10px rgba(93,242,176,0); }
    100% { box-shadow: 0 0 0 0 rgba(93,242,176,0); }
  }

  h1 {
    margin-top: 28px;
    font-size: clamp(34px, 7vw, 64px);
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff 20%, rgba(255,255,255,0.62));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-wrap: balance;
  }

  .lead {
    margin-top: 20px;
    max-width: 52ch;
    font-size: clamp(16px, 2.4vw, 19px);
    line-height: 1.6;
    color: var(--ink-soft);
  }

  /* ---------- Мелкие стеклянные плашки ---------- */
  .chips {
    margin-top: 36px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .chip {
    padding: 16px 18px;
    border-radius: 22px;
    background: var(--glass);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    min-width: 0;
  }
  .chip small {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .chip b {
    display: block;
    margin-top: 6px;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: rgba(233,236,255,0.5);
    text-align: center;
  }

  /* ---------- Адаптив ---------- */
  @media (max-width: 620px) {
    .chips { grid-template-columns: 1fr; }
    .pane { border-radius: 28px; }
  }

  /* если браузер не умеет backdrop-filter */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .pane { background: rgba(22, 24, 58, 0.88); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .status i, .pane::after { animation: none; }
  }
</style>
</head>
<body>

  <div class="liquid" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <section class="pane" id="pane">
      <div class="status"><i></i>Сервер работает</div>

      <h1>Сайт скоро откроется</h1>

      <p class="lead">
        Мы настраиваем всё, чтобы здесь было удобно. Пока идёт работа,
        на этой странице ничего нет — загляните чуть позже.
      </p>

      <div class="chips">
        <div class="chip"><small>Адрес</small><b>nenaivniy.duckdns.org</b></div>
        <div class="chip"><small>Соединение</small><b id="proto">—</b></div>
        <div class="chip"><small>Ваше время</small><b id="clock">--:--:--</b></div>
      </div>
    </section>

    <footer>© <span id="year"></span> nenaivniy.duckdns.org</footer>
  </main>

<script>
  // Блик на стекле следует за курсором / пальцем
  (function () {
    var pane = document.getElementById('pane');
    function move(x, y) {
      var r = pane.getBoundingClientRect();
      pane.style.setProperty('--mx', (x - r.left) + 'px');
      pane.style.setProperty('--my', (y - r.top) + 'px');
    }
    window.addEventListener('pointermove', function (e) { move(e.clientX, e.clientY); }, { passive: true });
  })();

  // Часы
  (function () {
    var el = document.getElementById('clock');
    function tick() {
      el.textContent = new Date().toLocaleTimeString('ru-RU');
    }
    tick();
    setInterval(tick, 1000);
  })();

  // Протокол и год
  document.getElementById('proto').textContent =
    location.protocol === 'https:' ? 'HTTPS, защищено' : 'HTTP';
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
